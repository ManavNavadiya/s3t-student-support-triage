[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "s3t"
version = "1.0.0"
description = "S3T - reusable student-support triage NLP asset (category, urgency, confidence, extraction, human-review flag)"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "nltk>=3.8",
  "pydantic>=2.0",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=2.7", "torch>=2.1"]   # needed for the hybrid model
api   = ["fastapi>=0.100", "uvicorn>=0.23", "httpx>=0.24"]
dev   = ["pytest>=7"]
all   = ["s3t[sbert,api,dev]"]

[project.scripts]
s3t = "s3t.cli:main"

[tool.setuptools.packages.find]
include = ["s3t*"]

[tool.setuptools.package-data]
s3t = ["resources/models/*.joblib", "resources/models/*.json", "resources/data/*.csv", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
